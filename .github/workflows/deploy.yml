name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      API_PROJECT_NAME: ${{ secrets.API_PROJECT_NAME }}
      WEB_PROJECT_NAME: ${{ secrets.WEB_PROJECT_NAME }}
      API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
      WEB_PUBLIC_URL: ${{ secrets.WEB_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Ejecutar despliegue
        run: ./deploy.sh
