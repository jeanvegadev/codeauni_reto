name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mining
          POSTGRES_PASSWORD: mining
          POSTGRES_DB: mining_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mining -d mining_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mining:mining@localhost:5432/mining_test?schema=public
      DIRECT_URL: postgresql://mining:mining@localhost:5432/mining_test?schema=public
      TEST_DATABASE_URL: postgresql://mining:mining@localhost:5432/mining_test?schema=public
      VITE_API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Instalar backend
        run: npm ci --prefix apps/api --no-audit --no-fund

      - name: Instalar frontend
        run: npm ci --prefix apps/web --no-audit --no-fund

      - name: Typecheck y pruebas unitarias
        run: |
          npm run typecheck
          npm test

      - name: Migraciones y pruebas de integración
        run: |
          npm --prefix apps/api run db:migrate:deploy
          npm --prefix apps/api run test:integration

      - name: Build de producción
        run: npm run build
